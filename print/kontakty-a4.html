<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Shahrezade — контакты</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink:#1c1416; --accent:#7a1f3d; --gold:#b08d57; --soft:#f7f1ec; }
  html, body { width:210mm; height:297mm; background:#fff; }
  body { -webkit-print-color-adjust:exact; print-color-adjust:exact; font-family:'Montserrat',sans-serif; color:var(--ink); }
  .page { position:relative; width:210mm; height:297mm; padding:22mm 18mm; display:flex; flex-direction:column; align-items:center; }
  .frame { position:absolute; inset:9mm; border:0.6mm solid var(--gold); pointer-events:none; }
  .frame::after { content:""; position:absolute; inset:2mm; border:0.25mm solid var(--gold); }

  /* ЛОГОТИП — сверху. Чтобы вставить свой файл: замените блок .logo на <img src="logo.png" class="logo-img"> */
  .logo { margin-top:14mm; text-align:center; }
  .logo .mark { font-family:'Cormorant Garamond',serif; font-weight:600; font-size:46pt; letter-spacing:0.06em; color:var(--accent); line-height:1; }
  .logo .line { width:46mm; height:0.4mm; background:var(--gold); margin:6mm auto 4mm; }
  .logo .sub { font-size:10pt; letter-spacing:0.42em; text-transform:uppercase; color:var(--ink); }
  .logo-img { max-width:150mm; max-height:90mm; margin-top:14mm; }

  .spacer { flex:1; }

  /* КОНТАКТЫ — снизу */
  .contacts { width:100%; text-align:center; margin-bottom:10mm; }
  .messengers { display:flex; justify-content:center; gap:14mm; margin-bottom:10mm; }
  .msg { display:flex; align-items:center; gap:3.5mm; font-weight:600; font-size:17pt; }
  .msg svg { width:14mm; height:14mm; }
  .wa svg { fill:#25D366; } .tg svg { fill:#229ED9; }
  .divider { width:60mm; height:0.4mm; background:var(--gold); margin:0 auto 9mm; }
  .phones { list-style:none; display:flex; flex-direction:column; gap:5mm; }
  .phones li { font-size:30pt; font-weight:600; letter-spacing:0.04em; }
  .phones li span { font-size:16pt; font-weight:500; color:var(--accent); margin-right:3mm; letter-spacing:0; }
</style>
</head>
<body>
<div class="page">
  <div class="frame"></div>

  <div class="logo">
    <div class="mark">Shahrezade</div>
    <div class="line"></div>
    <div class="sub">женское нижнее бельё</div>
  </div>

  <div class="spacer"></div>

  <div class="contacts">
    <div class="messengers">

    <div class="divider"></div>
    <ul class="phones">
      <li><span>+992</span>987-77-40-20</li>
      <li><span>+992</span>755-04-80-80</li>
      <li><span>+992</span>985-31-45-18</li>
    </ul>
  </div>
</div>
</body>
</html>
